# End-to-end GateBroker demo. See README.md.
#
# identity (Keycloak) -> gatebroker -> gateway (LiteLLM) -> mock model provider
#
# Nothing here reaches the internet at run time and no provider account is needed.
#
# Every service shares one network namespace, so `localhost` means the same thing to
# your browser and to every container. That matters because tokens carry the issuer
# that minted them and the broker validates it: with separate namespaces there is no
# single address that both a browser on the host and the broker in a container can
# use, and the demo would need a hosts-file entry. This is the same arrangement as a
# Kubernetes pod. It is a convenience for the demo only; deploy/ shows services
# addressing each other by name, which is what a real deployment does.
name: gatebroker-demo

services:
  # Holds the shared network namespace, so the published ports live here.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/etc/tls/keycloak.pem
      - --https-certificate-key-file=/etc/tls/keycloak.key
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens carry this as `iss`, and the broker validates the issuer and requires
      # the JWKS endpoint to share its origin. One address for everyone.
      KC_HOSTNAME: https://localhost:8443
      # A plaintext listener bound inside the namespace, used only by the health
      # check below: this image ships no HTTP client, and its management port
      # inherits TLS, so a shell probe cannot speak to it. Not published.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "9080"
      JAVA_OPTS_APPEND: -Xms64m -Xmx512m
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./tls:/etc/tls:ro
    ports:
      - "8443:8443"  # identity provider
      - "8080:8080"  # the broker, which shares this namespace
    healthcheck:
      # Ready when the demo realm's discovery document is served, which is exactly
      # what the broker needs, rather than a generic "the process is up".
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET /realms/gatebroker-demo/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"issuer"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  # Stands in for a real model provider so the demo needs no API key.
  mock-model:
    image: python:3.11-slim
    network_mode: "service:keycloak"
    command: ["python", "/srv/server.py"]
    volumes:
      - ./mock-model:/srv:ro
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The gateway. Single unified image, no database, no UI login: enough to prove the
  # broker's upstream contract without a production split deployment.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    network_mode: "service:keycloak"
    command:
      - --config
      - /etc/litellm/config.yaml
      - --port
      - "4000"
      - --ssl_certfile_path
      - /etc/tls/litellm.pem
      - --ssl_keyfile_path
      - /etc/tls/litellm.key
    environment:
      LITELLM_MASTER_KEY: sk-demo-gateway-key-not-a-secret
      LITELLM_LOG: ERROR
    volumes:
      - ./litellm:/etc/litellm:ro
      - ./tls:/etc/tls:ro
    depends_on:
      mock-model:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import ssl, urllib.request
          context = ssl.create_default_context(cafile="/etc/tls/ca.pem")
          urllib.request.urlopen("https://localhost:4000/health/liveliness", context=context, timeout=5).read()
      interval: 5s
      timeout: 6s
      retries: 40
      start_period: 15s

  # The component under demonstration, built from this repository.
  gatebroker:
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: "service:keycloak"
    # The broker refuses to start when it cannot fetch signing keys, which is right --
    # it must not serve traffic it cannot validate. Under an orchestrator that shows up
    # as a crash-loop that clears itself once the identity provider is back. Compose
    # has no such behaviour by default, so a provider still restarting would leave the
    # broker exited for good.
    restart: on-failure
    environment:
      GABRO_OIDC_ISSUER: https://localhost:8443/realms/gatebroker-demo
      GABRO_OIDC_JWKS_URL: https://localhost:8443/realms/gatebroker-demo/protocol/openid-connect/certs
      GABRO_OIDC_AUDIENCE: gatebroker-api
      GABRO_OIDC_REQUIRED_SCOPE: broker
      # Keycloak spells granted scopes `scope` and the subject `sub`; Entra uses
      # `scp` and `oid`, which are the defaults.
      GABRO_OIDC_SCOPE_CLAIM: scope
      GABRO_OIDC_SUBJECT_CLAIM: sub
      GABRO_OIDC_ALLOWED_APP_ROLES: broker-automation
      GABRO_POLICY_PATH: /etc/gatebroker/policies.json
      GABRO_KEY_DIR: /etc/gatebroker
      GABRO_UPSTREAM_BASE_URL: https://localhost:4000
      GABRO_UPSTREAM_TRUSTED_HOSTS: localhost
      GABRO_RATE_LIMIT_REQUESTS: "30"
      GABRO_RATE_LIMIT_WINDOW_SECONDS: "60"
      # Both the JWKS fetch and the upstream call must trust the demo CA. The
      # broker's HTTP clients run with trust_env=False so nothing ambient can
      # redirect them, which is why the CA is named here rather than inherited.
      GABRO_TLS_CA_BUNDLE: /etc/gatebroker-tls/ca.pem
    volumes:
      - ./entitlements:/etc/gatebroker:ro
      - ./tls:/etc/gatebroker-tls:ro
    depends_on:
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      # Ready only once the JWKS snapshot is fresh and every policy key resolves.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/readyz').read()"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Drives the walkthrough. Does not run unless asked for by profile.
  smoke:
    image: python:3.11-slim
    profiles: ["smoke"]
    network_mode: "service:keycloak"
    command: ["python", "/srv/smoke.py"]
    environment:
      SSL_CERT_FILE: /etc/demo-tls/ca.pem
    volumes:
      - ./smoke:/srv:ro
      - ./tls:/etc/demo-tls:ro
    depends_on:
      gatebroker:
        condition: service_healthy
