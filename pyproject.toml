[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "gatebroker"
version = "0.1.0"
description = "Fail-closed authorization broker that exchanges an OIDC identity for scoped access to an OpenAI-compatible model gateway"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = [
    "ai-gateway",
    "authorization",
    "entitlements",
    "llm",
    "oidc",
    "openai",
    "reverse-proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "click>=8.1,<9.0",
    "cryptography>=50,<51",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "keyring>=25,<27",
    "msal>=1.31,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.urls]
Homepage = "https://github.com/kayahk/gatebroker"
Issues = "https://github.com/kayahk/gatebroker/issues"

[project.scripts]
gabro = "gatebroker.cli:main"

[project.optional-dependencies]
bundle = ["pyinstaller>=6.0,<7.0"]
test = [
    "bandit>=1.9,<2.0",
    "pip-audit>=2.10,<3.0",
    "pytest>=8.0",
    "PyYAML>=6.0,<7.0",
    "ruff>=0.12,<1.0",
    "setuptools>=83",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]
